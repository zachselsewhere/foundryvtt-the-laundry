name: Release

# Publish a Foundry-installable release whenever a version tag (vX.Y.Z) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: vars
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into system.json
        run: |
          tmp="$(mktemp)"
          jq --arg v "${{ steps.vars.outputs.version }}" '.version = $v' system.json > "$tmp"
          mv "$tmp" system.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Compile compendium packs (src/packs -> packs, LevelDB)
        run: |
          for dir in src/packs/*/; do
            name="$(basename "$dir")"
            npx --yes @foundryvtt/foundryvtt-cli@latest package pack \
              --id the-laundry --type System -n "$name" \
              --in "$dir" --out packs
          done

      - name: Build system zip (files at archive root)
        run: |
          zip -r the-laundry.zip . \
            -x ".git/*" ".github/*" "*.zip" ".gitignore" ".DS_Store" "release.sh" "src/*" "tools/*"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" system.json the-laundry.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" system.json the-laundry.zip \
              --title "The Laundry ${GITHUB_REF_NAME}" \
              --notes "Automated release of The Laundry system ${GITHUB_REF_NAME}. Install/Update in Foundry via the manifest URL in the README."
          fi
